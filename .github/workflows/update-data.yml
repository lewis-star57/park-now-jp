name: Update parking meter data

on:
  schedule:
    # 毎月3日 09:00 JST (00:00 UTC) に実行
    # JARTIC は月初に更新されるため、念のため数日待つ
    - cron: "0 0 3 * *"
  workflow_dispatch:
    inputs:
      prefectures:
        description: "対象都道府県コード（カンマ区切り、空で全国）"
        required: false
        default: ""
      holidays_only:
        description: "祝日データのみ更新"
        type: boolean
        default: false

jobs:
  update-data:
    name: Fetch and commit data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch holidays
        run: pnpm --filter @park-now-jp/data-pipeline run fetch:holidays

      - name: Fetch JARTIC data
        if: ${{ inputs.holidays_only != true }}
        run: |
          if [ -n "${{ inputs.prefectures }}" ]; then
            pnpm --filter @park-now-jp/data-pipeline run fetch -- --pref "${{ inputs.prefectures }}"
          else
            pnpm --filter @park-now-jp/data-pipeline run fetch
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): monthly data update"
          title: "🗓 Monthly data update — $(date +%Y-%m)"
          body: |
            ## 月次データ更新

            JARTIC のオープンデータ（規制種別103種別）と内閣府の祝日データを自動取得しました。

            ### チェック項目
            - [ ] GeoJSON のサイズが妥当か（極端に増減していないか）
            - [ ] 祝日データに翌年分が含まれているか
            - [ ] CI が通っているか

            ---
            🤖 Auto-generated by GitHub Actions
          branch: chore/data-update
          delete-branch: true
          labels: |
            data-update
            automated
