name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest

    # 注意: ジョブ全体の TZ は固定しない。
    # 判定ロジックは端末タイムゾーンに依存しない実装になっており、
    # それを保証するためテストは UTC / JST の両方で実行する（下記 Test ステップ）。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test (TZ=UTC)
        run: pnpm test
        env:
          TZ: UTC

      - name: Test (TZ=Asia/Tokyo)
        run: pnpm test
        env:
          TZ: Asia/Tokyo

      - name: Build (web)
        run: pnpm --filter @park-now-jp/web build
