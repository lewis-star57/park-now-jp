name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest

    # status.ts の nextHourBoundary が setHours() を使っているため、
    # ジョブのローカル TZ が JST でないと nextChangeAt のテストが
    # UTC ランナー上で失敗する。アプリが日本専用なので TZ を明示。
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (web)
        run: pnpm --filter @park-now-jp/web build
